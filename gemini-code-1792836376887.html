<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="build" content="2026-10-24.10">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق المنطقة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--surface:#fff;--field:#fff;--line:#dadde1;--text:#050505;--muted:#65676b;--accent:#1a73e8;--accent-h:#1765cc;--on:#fff;--ok:#1e8e3e;--warn:#b06000;--hov:#e4e6e9;--sh:0 1px 2px rgba(0,0,0,.14);--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191a;--surface:#242526;--field:#3a3b3c;--line:#3e4042;--text:#e4e6eb;--muted:#b0b3b8;--accent:#2d88ff;--accent-h:#5aa0ff;--ok:#5bd183;--warn:#f0b24a;--hov:#3a3b3c;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18191a;--surface:#242526;--field:#3a3b3c;--line:#3e4042;--text:#e4e6eb;--muted:#b0b3b8;--accent:#2d88ff;--accent-h:#5aa0ff;--ok:#5bd183;--warn:#f0b24a;--hov:#3a3b3c;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{font-size:var(--fs)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Roboto","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
button,input,select,textarea{font:inherit;color:var(--text)}
button{-webkit-tap-highlight-color:transparent}
input,select,textarea{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--field);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label{display:block;margin:0 0 .35rem;font-size:.86rem;font-weight:500}
.f{margin-bottom:1rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:.3rem;display:flex;justify-content:space-between;gap:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.3rem;border:0;border-radius:999px;background:var(--accent);color:var(--on);font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--accent-h)}
.btn:disabled{opacity:.55;cursor:default}
.btn.g{background:var(--hov);color:var(--text);font-weight:500}
.btn.g:hover{background:var(--line)}
.btn.danger{background:#d93025;color:#fff}
.card{background:var(--surface);border-radius:12px;padding:1.4rem;box-shadow:var(--sh)}
.muted{color:var(--muted);font-size:.88rem}
h2{margin:0 0 1rem;font-size:1.25rem;font-weight:700}
h4{margin:1.2rem 0 .6rem;font-size:.95rem;font-weight:600}
.ic{width:1.35rem;height:1.35rem;fill:currentColor;flex:none}.ic.sm{width:1rem;height:1rem}.ic.xl{width:2.4rem;height:2.4rem}
.msg{min-height:1.3rem;margin:.8rem 0 0;text-align:center;font-size:.88rem;color:var(--warn)}
.ok{color:var(--ok);font-weight:500}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
#login .card{width:100%;max-width:26rem;padding:2rem;box-shadow:0 2px 4px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.1)}
#login h1{margin:0 0 .3rem;text-align:center;font-size:1.6rem;font-weight:700}
.social{display:grid;gap:.6rem}
.social button{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.65rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:500}
.social button:hover{background:var(--bg)}
.social svg{width:1.15rem;height:1.15rem}
.or{display:flex;align-items:center;gap:.8rem;margin:1.3rem 0;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sw a{color:var(--accent);font-weight:600;cursor:pointer}
/* segmented + avatar */
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:.2rem;gap:.1rem}
.seg button{padding:.4rem .95rem;border:0;border-radius:999px;background:none;cursor:pointer;font-size:.88rem}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600}
.av{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;border:0}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.16);padding:.55rem 1rem;display:flex;align-items:center;gap:.8rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.25rem;color:var(--accent);white-space:nowrap}
.mark{width:2.3rem;height:2.3rem;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center}
.searchbar{flex:1;max-width:30rem;display:flex;align-items:center;gap:.5rem;background:var(--bg);border-radius:999px;padding:0 1rem;color:var(--muted)}
.sbtn{border:0;background:none;color:var(--muted);display:flex;padding:0;cursor:pointer}
.searchbar:focus-within{box-shadow:0 0 0 2px var(--accent)}
.searchbar input{border:0;background:none;box-shadow:none;padding:.6rem 0;border-radius:0}
.searchbar input:focus{border:0;box-shadow:none}
.acts{display:flex;align-items:center;gap:.5rem;margin-inline-start:auto}
.ibtn{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--bg);color:var(--text);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--hov)}
.avatar{cursor:pointer}
/* layout */
.shell{max-width:62rem;margin:0 auto;padding:1rem;display:grid;grid-template-columns:16rem minmax(0,1fr);gap:1.25rem}
.side{position:sticky;top:4.2rem;align-self:start}
.prof{display:flex;align-items:center;gap:.7rem;padding:.55rem;border-radius:10px;cursor:pointer;font-weight:600}
.prof:hover{background:var(--hov)}
.sect{padding:.9rem .6rem .35rem;color:var(--muted);font-size:.8rem;font-weight:600}
.cats{display:flex;flex-direction:column;gap:.1rem}
.cat{display:flex;align-items:center;gap:.8rem;padding:.6rem;border:0;border-radius:10px;background:none;cursor:pointer;text-align:start;font-weight:500}
.cat:hover{background:var(--hov)}
.cat.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
.side select{margin:0 .1rem;width:100%}
.composer{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;margin-bottom:.9rem}
.comp{flex:1;text-align:start;border:0;border-radius:999px;background:var(--bg);color:var(--muted);padding:.7rem 1.1rem;cursor:pointer}
.comp:hover{background:var(--hov)}
.subs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.7rem}
.sub{padding:.4rem .95rem;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--sh);cursor:pointer;font-size:.88rem}
.sub.on{background:var(--accent);color:var(--on)}
#count{margin:0 .2rem .6rem}
.list{display:grid;gap:.75rem}
.item{display:flex;gap:1rem;background:var(--surface);border-radius:12px;box-shadow:var(--sh);padding:.75rem;cursor:pointer;transition:box-shadow .15s}
.item:hover{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.thumb,.nothumb{width:7.5rem;aspect-ratio:1;border-radius:8px;flex:none;background:var(--bg);overflow:hidden}
.thumb{display:block;object-fit:cover;cursor:zoom-in}
.nothumb{display:grid;place-items:center;color:var(--muted);text-align:center;font-size:.72rem;padding:.3rem}
.nothumb.has{padding:0;cursor:zoom-in}
.nothumb img{width:100%;height:100%;object-fit:cover;display:block}
.ib{flex:1;min-width:0;display:flex;flex-direction:column;gap:.2rem}
.price{font-weight:700;font-size:1.2rem}
.ib h3{margin:0;font-size:1rem;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.badges{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.3rem}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;padding:.15rem .6rem;border-radius:999px;background:var(--bg);color:var(--muted)}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);font-weight:500}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.empty{background:var(--surface);border-radius:12px;box-shadow:var(--sh);text-align:center;color:var(--muted);padding:3rem 1rem}
.item{position:relative}
.item.sold{filter:grayscale(1);opacity:.6;cursor:default;pointer-events:none;box-shadow:none;background:var(--bg);border:1px dashed var(--line)}
.price{padding-inline-end:1.8rem}
.dots{position:absolute;top:.4rem;inset-inline-end:.4rem;width:2rem;height:2rem;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.dots:hover{background:var(--hov)}
.menu{position:absolute;top:2.5rem;inset-inline-end:.4rem;z-index:6;min-width:11rem;background:var(--surface);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.28);padding:.3rem}
.menu button{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem .7rem;border:0;border-radius:8px;background:none;cursor:pointer;text-align:start}
.menu button:hover{background:var(--hov)}
.flt{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.fl{display:flex;align-items:center;gap:.4rem;margin:0;font-size:.85rem;font-weight:500}
.fl select{width:auto;padding:.35rem .8rem;border-radius:999px}
input[type=radio]{width:auto;padding:0;margin-top:.3rem;accent-color:var(--accent)}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .9rem;margin:0 0 .5rem;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:1rem;font-weight:400}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;z-index:20;overflow:auto}
.modal .card{max-width:36rem;width:100%;position:relative;padding:1.25rem 1.5rem 1.5rem;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.modal h2{text-align:center;padding:0 2.6rem .9rem;margin:0 0 1rem;border-bottom:1px solid var(--line);font-size:1.2rem}
.xbtn{position:absolute;top:.85rem;inset-inline-end:.85rem;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.xbtn:hover{background:var(--hov)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem}
dl{display:grid;grid-template-columns:7rem 1fr;gap:.5rem 1rem;margin:0}
dt{color:var(--muted);font-size:.88rem}dd{margin:0}
.dtop{display:flex;gap:1rem;align-items:flex-start}
.thumb.big{width:9rem}
.dprice{font-size:1.6rem;font-weight:700;line-height:1.2}
.dinf{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.pub{display:flex;align-items:center;gap:.7rem;padding:.8rem 0;margin-top:1rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.desc{background:var(--bg);border-radius:8px;padding:1rem 1.1rem;line-height:1.95;white-space:pre-wrap}
textarea.big{min-height:11rem;line-height:1.8;resize:vertical}
.loc{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg);border-radius:8px;padding:.8rem}
.up{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.up .col{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.cl{margin-top:1rem;padding:1rem;border-radius:8px;background:var(--bg)}
.cl a{color:var(--accent);font-weight:500;text-decoration:none}
.warnbox{margin-top:1rem;padding:1rem;border:1px solid var(--warn);border-radius:8px}
.warnbox p{margin:0 0 .8rem}
.set{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{display:block;font-weight:500}
.set input[type=checkbox]{appearance:none;-webkit-appearance:none;width:2.6rem;height:1.5rem;padding:0;border:0;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.set input[type=checkbox]::after{content:"";position:absolute;top:.15rem;inset-inline-start:.15rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.set input[type=checkbox]:checked{background:var(--accent)}
.set input[type=checkbox]:checked::after{inset-inline-start:calc(100% - 1.35rem)}
.toast{position:fixed;bottom:1.5rem;inset-inline:1rem;margin:0 auto;max-width:24rem;z-index:40;padding:.8rem 1rem;border-radius:8px;background:#323232;color:#fff;text-align:center;font-weight:500}
.lb{position:fixed;inset:0;z-index:30;background:rgba(5,8,14,.88);display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:var(--surface)}
@media (max-width:860px){
 .shell{grid-template-columns:minmax(0,1fr);gap:.6rem;padding:.7rem}
 .side{position:static}
 .prof,.sect{display:none}
 .cats{flex-direction:row;overflow-x:auto;gap:.45rem;padding-bottom:.2rem}
 .cat{background:var(--surface);box-shadow:var(--sh);border-radius:999px;padding:.45rem .95rem;white-space:nowrap}
 .cat .ic{display:none}
 .side select{margin-top:.5rem}
}
@media (max-width:600px){
 .brand span:last-child{display:none}
 .btn .lbl{display:none}
 #add{padding:.6rem}
 .thumb,.nothumb{width:6rem}
 .thumb.big{width:7rem}
}
</style>
</head>
<body>

<section id="login">
 <main class="card">
  <h1 id="lt">تسجيل الدخول</h1>
  <p class="muted" style="text-align:center;margin:0 0 1.5rem">منصة الإعلانات والوظائف والخدمات في منطقتك</p>
  <div id="lmain">
  <div class="social">
   <button type="button"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.500c-.2 1.400-1.700 4.100-5.500 4.100-3.300 0-6-2.700-6-6.200s2.700-6.200 6-6.200c1.900 0 3.100.8 3.800 1.500l2.600-2.500C16.800 3.300 14.600 2.400 12 2.400 6.700 2.400 2.400 6.700 2.400 12s4.300 9.600 9.600 9.600c5.500 0 9.200-3.900 9.200-9.400 0-.6-.1-1.100-.2-1.600H12z"/></svg>المتابعة عبر Google</button>
   <button type="button"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12a12 12 0 1 0-13.900 11.900v-8.400H7.100V12h3V9.400c0-3 1.800-4.700 4.500-4.700 1.300 0 2.700.2 2.700.2v3h-1.500c-1.500 0-2 .9-2 1.900V12h3.400l-.5 3.500h-2.900v8.400A12 12 0 0 0 24 12z"/></svg>المتابعة عبر Facebook</button>
  </div>
  <div class="or">أو بحساب الموقع</div>
  <div id="rg" class="hide">
   <div class="f"><label for="rn">الاسم الكامل</label><input id="rn" autocomplete="name"></div>
   <div class="f"><label>ماذا تريد من المنصة؟ (اختياري)</label><div class="seg" id="rrole"></div></div>
   <div class="f"><label>الخدمات التي أهتم بها (اختياري)</label><div class="subs" id="rint" style="margin:0"></div></div>
   <div class="f"><label for="rsv">الخدمة التي أقدمها أو أبحث عنها (اختياري)</label><textarea id="rsv" rows="3" maxlength="400" placeholder="مثال: فني كهرباء بخبرة 10 سنوات، أو أبحث عن مدرس رياضيات"></textarea></div>
   <div class="muted" style="margin-bottom:.6rem">طريقة إنشاء الحساب:</div>
  </div>
  <form id="lf" novalidate>
   <div class="f"><label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" placeholder="name@example.com"></div>
   <div class="f"><label for="pw">كلمة المرور</label><input id="pw" type="password" dir="ltr"></div>
   <button class="btn" id="lb" style="width:100%" type="submit">دخول</button>
  </form>
  <p class="msg" id="lm" role="status"></p>
  <p id="swp" class="muted sw" style="text-align:center;margin:1rem 0 0"><span id="st">ليس لديك حساب؟</span> <a id="tg">إنشاء حساب جديد</a></p>
  </div>
 </main>
</section>

<section id="onb" class="hide" style="min-height:100vh;align-items:center;justify-content:center;padding:1.5rem 1rem">
 <form class="card" id="of" novalidate style="width:100%;max-width:34rem">
  <h2>أكمل ملفك الشخصي</h2>
  <p class="muted" style="margin-top:-.5rem">تمت المصادقة بنجاح. عرّفنا بنفسك لنخصص لك المنصة.</p>
  <div class="f"><label for="on">الاسم الكامل</label><input id="on" autocomplete="name"></div>
  <div class="f"><label>ماذا تريد من المنصة؟ (اختياري)</label><div class="seg" id="orole"></div></div>
  <div class="f"><label>الخدمات التي أهتم بها (اختياري)</label><div class="subs" id="oint" style="margin:0"></div></div>
  <div class="f"><label for="osv">الخدمة التي أقدمها أو أبحث عنها (اختياري)</label><textarea id="osv" rows="4" maxlength="400" placeholder="مثال: فني كهرباء بخبرة 10 سنوات، أو أبحث عن مدرس رياضيات لابني"></textarea></div>
  <div class="f"><label for="oc2">رقم الهاتف (اختياري)</label><input id="oc2" type="tel" dir="ltr" placeholder="0791234567"></div>
  <button class="btn" type="submit" style="width:100%">حفظ والمتابعة</button>
  <p class="msg" id="om" role="status"></p>
 </form>
</section>

<section id="app" class="hide">
 <header class="top">
  <div class="brand"><span class="mark" id="mark"></span><span>سوق المنطقة</span></div>
  <form class="searchbar" id="sf" role="search"><button class="sbtn" id="sic" type="submit" aria-label="بحث"></button><input id="q" type="search" enterkeyhint="search" placeholder="ابحث في سوق المنطقة" aria-label="بحث" autocomplete="off"></form>
  <div class="acts">
   <button class="btn" id="add" type="button"></button>
   <button class="ibtn" id="th" type="button" aria-label="الوضع"></button>
   <button class="ibtn" id="sg" type="button" aria-label="الإعدادات"></button>
   <button class="av avatar" id="av" type="button" aria-label="حسابي"></button>
  </div>
 </header>
 <div class="shell">
  <aside class="side">
   <div class="prof" id="prof"></div>
   <div class="sect">الأقسام</div>
   <nav class="cats" id="cats"></nav>
   <div class="sect">المنطقة</div>
   <select id="reg" aria-label="المنطقة"></select>
  </aside>
  <main>
   <div class="card composer"><div class="av" id="cav"></div><button class="comp" id="comp" type="button">ماذا تريد أن تعرض أو تطلب؟</button></div>
   <div class="subs" id="subs"></div>
   <div class="flt" id="flt"></div>
   <div class="muted" id="count"></div>
   <div class="list" id="grid"></div>
  </main>
 </div>
</section>

<div id="modal" class="modal hide"><div class="card" id="mc"></div></div>
<div id="toast" class="toast hide" role="status"></div>
<div id="lb" class="lb hide" role="dialog" aria-label="عرض الصورة"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
